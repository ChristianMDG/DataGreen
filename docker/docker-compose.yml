version: '3.8'

services:
  # ====== BASE DE DONNÉES AIRFLOW ======
  postgres_airflow:
    image: postgres:14
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network

  # ====== DATA WAREHOUSE ======
  postgres_warehouse:
    image: postgres:14
    container_name: postgres_warehouse
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      POSTGRES_DB: ${WAREHOUSE_DB:-air_quality_db}
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network

  # ====== MINIO (STOCKAGE S3) ======
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"\]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - airflow_network

  # ====== AIRFLOW WEBSERVER ======
  webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: airflow_webserver
    depends_on:
      postgres_airflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres_airflow:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      PYTHONPATH: /opt/airflow
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - airflow_network

  # ====== AIRFLOW SCHEDULER ======
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: airflow_scheduler
    depends_on:
      postgres_airflow:
        condition: service_healthy
      webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres_airflow:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - ./logs:/opt/airflow/logs
    command: scheduler
    networks:
      - airflow_network

networks:
  airflow_network:
    driver: bridge

volumes:
  postgres_airflow_data:
  postgres_warehouse_data:
  minio_data:
